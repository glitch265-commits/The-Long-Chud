<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Chud Game Center</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #ffffff 0%, #a1a8b8 2%, #222836 10%, #0b0f19 30%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow-x: hidden;
    }

    /* Score Counter UI Overlay */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 25, 0.95);
      padding: 12px 30px;
      border-radius: 12px;
      border: 2px solid #ff4500;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    #score {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0;
      color: #ff4500;
      letter-spacing: 1px;
    }

    /* Main Scrolling Content Area */
    #main-game-content {
      display: block;
    }

    .character-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
    }

    .head-segment {
      width: 450px;
      height: 380px;
      background-image: url('chud.jpg');
      background-position: top center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      margin-top: 100px;
    }

    .infinite-shirt {
      width: 450px;
      height: 20000px; 
      background-image: url('chud.jpg');
      background-position: center -390px; 
      background-size: 450px auto;
      background-repeat: repeat-y;
      position: relative;
    }

    .bottom-segment {
      width: 450px;
      height: 140px;
      background-image: url('chud.jpg');
      background-position: bottom center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 100px;
    }

    .end-button {
      background-color: #ff4500;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 5px 0 #992600;
      transition: all 0.1s ease;
      font-family: inherit;
    }

    .end-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #992600;
    }

    .chud-token {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid #00ffcc88;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      z-index: 50;
    }

    .chud-token.collected {
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }

    /* PONG ARCADE SCREEN STYLES */
    #pong-arena {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      z-index: 5000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #pong-canvas {
      background-color: #000;
      border: 4px solid #ff4500;
      box-shadow: 0 0 30px rgba(255, 69, 0, 0.3);
    }

    .pong-title {
      font-size: 2rem;
      font-weight: bold;
      color: #ff4500;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    /* CHUD SURFERS ARCADE SCREEN STYLES */
    #surfers-arena {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #111116;
      z-index: 6000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #surfers-canvas {
      background-color: #222;
      border: 4px solid #00ffcc;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
    }

    .surfers-title {
      font-size: 2rem;
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- Main Scrolling Segment Wrap -->
  <div id="main-game-content">
    <div id="ui-container">
      <div id="score">CHUDS COLLECTED: 0</div>
    </div>

    <div class="character-assembly">
      <div class="head-segment"></div>
      <div class="infinite-shirt" id="shirt-body"></div>
      <div class="bottom-segment">
        <button class="end-button" onclick="triggerEndGame()">FINISH THE CHALLENGE</button>
      </div>
    </div>
  </div>

  <!-- Secret Pong Container Screen -->
  <div id="pong-arena">
    <div class="pong-title">CHUD PONG</div>
    <p style="color: #aaa; margin: 0 0 10px 0;">Reach 25 bounces to unlock the next mode!</p>
    <canvas id="pong-canvas" width="700" height="450"></canvas>
    <p style="color: #666; margin-top: 15px;">Move mouse left and right to control the paddle</p>
  </div>

  <!-- Chud Surfers Container Screen -->
  <div id="surfers-arena">
    <div class="surfers-title">CHUD SURFERS</div>
    <p style="color: #aaa; margin: 0 0 10px 0;">Use LEFT and RIGHT arrow keys to switch tracks. Avoid incoming barriers!</p>
    <canvas id="surfers-canvas" width="400" height="600"></canvas>
  </div>

  <script>
    let collectedCount = 0;
    const totalTokensToSpawn = 50; 
    const shirtBody = document.getElementById('shirt-body');
    const scoreDisplay = document.getElementById('score');
    let pongAnimationId;

    // Spawns tokens down the body canvas
    for (let i = 0; i < totalTokensToSpawn; i++) {
      const token = document.createElement('div');
      token.className = 'chud-token';
      token.innerText = 'CHUD';

      const randomX = Math.floor(Math.random() * 370); 
      const randomY = Math.floor(Math.random() * 19500); 

      token.style.left = randomX + 'px';
      token.style.top = randomY + 'px';

      const collect = () => {
        if (!token.classList.contains('collected')) {
          token.classList.add('collected');
          collectedCount++;
          scoreDisplay.innerText = `CHUDS COLLECTED: ${collectedCount}`;
        }
      };

      token.addEventListener('mouseover', collect);
      token.addEventListener('touchstart', collect);
      shirtBody.appendChild(token);
    }

    function triggerEndGame() {
      alert(`You have reached the end of Chud!\n\nFinal Score: You collected ${collectedCount} out of ${totalTokensToSpawn} CHUD words!\n\nClick OK to transport to CHUD PONG!`);
      document.getElementById('main-game-content').style.display = 'none';
      document.body.style.overflow = 'hidden'; 
      document.getElementById('pong-arena').style.display = 'flex';
      startPongGame();
    }

    function startPongGame() {
      const canvas = document.getElementById('pong-canvas');
      const ctx = canvas.getContext('2d');

      const ballImage = new Image();
      let imageLoaded = false;
      ballImage.onload = () => { imageLoaded = true; };
      ballImage.src = 'chud.jpg';

      const paddleWidth = 120;
      const paddleHeight = 15;
      let paddleX = (canvas.width - paddleWidth) / 2;

      const ballSize = 40; 
      let ballX = canvas.width / 2;
      let ballY = 50;
      let ballSpeedX = 4;
      let ballSpeedY = 4;
      let playerPongScore = 0;
      let promptTriggered = false;

      window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const rootX = e.clientX - rect.left;
        paddleX = rootX - (paddleWidth / 2);
        if (paddleX < 0) paddleX = 0;
        if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
      });

      function updateAndRenderFrame() {
        if (promptTriggered) return;

        ballX += ballSpeedX;
        ballY += ballSpeedY;

        if (ballX <= 0 || ballX + ballSize >= canvas.width) { ballSpeedX = -ballSpeedX; }
        if (ballY <= 0) { ballSpeedY = -ballSpeedY; }

        if (ballY + ballSize >= canvas.height - paddleHeight - 10) {
          if (ballX + ballSize >= paddleX && ballX <= paddleX + paddleWidth) {
            ballSpeedY = -ballSpeedY;
            ballSpeedY *= 1.05;
            ballSpeedX *= 1.05;
            playerPongScore++;

            if (playerPongScore === 25 && !promptTriggered) {
              promptTriggered = true;
              cancelAnimationFrame(pongAnimationId);
              
              setTimeout(() => {
                const choice = confirm("Milestone Achieved! You reached 25 bounces!\n\nWould you like to step it up and play CHUD SURFERS?");
                if (choice) {
                  document.getElementById('pong-arena').style.display = 'none';
                  document.getElementById('surfers-arena').style.display = 'flex';
                  startSurfersGame();
                } else {
                  promptTriggered = false;
                  requestAnimationFrame(updateAndRenderFrame);
                }
              }, 100);
              return;
            }

          } else if (ballY > canvas.height) {
            alert(`Game Over! You kept the Chud bouncing ${playerPongScore} times!`);
            ballX = canvas.width / 2;
            ballY = 50;
            ballSpeedX = 4;
            ballSpeedY = 4;
            playerPongScore = 0;
          }
        }

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4500';
        ctx.fillRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);

        if (imageLoaded) {
          ctx.drawImage(ballImage, ballX, ballY, ballSize, ballSize);
        } else {
          ctx.fillStyle = '#ff4500';
          ctx.fillRect(ballX, ballY, ballSize, ballSize);
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Bounces: ${playerPongScore}/25`, 20, 35);
