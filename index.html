<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Chud</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121214;
      overflow-x: hidden;
    }

    /* Character Container Layout */
    .character-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Top Head Piece */
    .head-segment {
      width: 450px;
      height: 380px;
      background-image: url('chud.jpg'); /* Updated to look for your .jpg */
      background-position: top center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      margin-top: 50px;
    }

    /* Infinite Looping Shirt Middle */
    .infinite-shirt {
      width: 450px;
      height: 15000px; 
      background-image: url('chud.jpg'); /* Updated to look for your .jpg */
      background-position: center -390px; 
      background-size: 450px auto;
      background-repeat: repeat-y;
    }

    /* Bottom Hem Finish */
    .bottom-segment {
      width: 450px;
      height: 140px;
      background-image: url('chud.jpg'); /* Updated to look for your .jpg */
      background-position: bottom center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      margin-bottom: 50px;
    }
  </style>
</head>
<body>

  <div class="character-assembly">
    <!-- Top Head Part -->
    <div class="head-segment"></div>
    
    <!-- Endless Repeating Shirt Body -->
    <div class="infinite-shirt"></div>
    
    <!-- Bottom Hem Cut Part -->
    <div class="bottom-segment"></div>
  </div>

</body>
</html>
