<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Chud Collector</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121214;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow-x: hidden;
    }

    /* 10-Second Loading Screen Overlay */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Aligns content toward the top */
      padding-top: 15vh; /* Places the text perfectly center-screen but a bit to the top */
      box-sizing: border-box;
      transition: opacity 0.5s ease;
    }

    #loading-title {
      font-size: 3rem;
      font-weight: bold;
      color: #ff4500;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
    }

    #loading-credit {
      font-size: 1.2rem;
      color: #888;
      margin: 10px 0 30px 0;
      letter-spacing: 1px;
    }

    /* Loading Bar Track Container */
    .progress-container {
      width: 300px;
      height: 12px;
      background-color: #222;
      border-radius: 6px;
      border: 2px solid #ff450033;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Filled Loading Progress Bar */
    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #ff4500;
      /* Animates smoothly from 0 to 100 over exactly 10 seconds */
      animation: loadProgress 10s linear forwards;
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* Score Counter UI Overlay */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 25, 0.95);
      padding: 12px 30px;
      border-radius: 12px;
      border: 2px solid #ff4500;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    #score {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0;
      color: #ff4500;
      letter-spacing: 1px;
    }

    /* Character Container Layout */
    .character-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
    }

    /* Top Head Piece */
    .head-segment {
      width: 450px;
      height: 380px;
      background-image: url('chud.jpg');
      background-position: top center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      margin-top: 100px;
    }

    /* Infinite Looping Shirt Middle */
    .infinite-shirt {
      width: 450px;
      height: 20000px; 
      background-image: url('chud.jpg');
      background-position: center -390px; 
      background-size: 450px auto;
      background-repeat: repeat-y;
      position: relative;
    }

    /* Bottom Hem Finish */
    .bottom-segment {
      width: 450px;
      height: 140px;
      background-image: url('chud.jpg');
      background-position: bottom center;
      background-size: 450px auto;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 100px;
    }

    /* The End Game Button styling */
    .end-button {
      background-color: #ff4500;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 5px 0 #992600;
      transition: all 0.1s ease;
      font-family: inherit;
    }

    .end-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #992600;
    }

    /* Scattered "CHUD" text tokens styles */
    .chud-token {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid #00ffcc88;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      z-index: 50;
    }

    .chud-token.collected {
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 10-Second Intro Loading Screen -->
  <div id="loading-screen">
    <div id="loading-title">loading chud...</div>
    <div id="loading-credit">made by herkus</div>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!-- Floating UI Header Overlay -->
  <div id="ui-container">
    <div id="score">CHUDS COLLECTED: 0</div>
  </div>

  <div class="character-assembly">
    <!-- Top Head Part -->
    <div class="head-segment"></div>
    
    <!-- Endless Repeating Shirt Body -->
    <div class="infinite-shirt" id="shirt-body"></div>
    
    <!-- Bottom Hem Cut Part with End Button -->
    <div class="bottom-segment">
      <button class="end-button" onclick="triggerEndGame()">FINISH THE CHALLENGE</button>
    </div>
  </div>

  <script>
    let collectedCount = 0;
    const totalTokensToSpawn = 50; 
    const shirtBody = document.getElementById('shirt-body');
    const scoreDisplay = document.getElementById('score');

    // Handles hiding the loading screen after precisely 10 seconds (10000 milliseconds)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        // Completely removes the layer after it fades out so you can click the website elements
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500); 
      }, 10000); 
    });

    // Spawns tokens down the body canvas
    for (let i = 0; i < totalTokensToSpawn; i++) {
      const token = document.createElement('div');
      token.className = 'chud-token';
      token.innerText = 'CHUD';

      const randomX = Math.floor(Math.random() * 370); 
      const randomY = Math.floor(Math.random() * 19500); 

      token.style.left = randomX + 'px';
      token.style.top = randomY + 'px';

      const collect = () => {
        if (!token.classList.contains('collected')) {
          token.classList.add('collected');
          collectedCount++;
          scoreDisplay.innerText = `CHUDS COLLECTED: ${collectedCount}`;
        }
      };

      token.addEventListener('mouseover', collect);
      token.addEventListener('touchstart', collect);

      shirtBody.appendChild(token);
    }

    function triggerEndGame() {
      alert(`You have reached the end of Chud!\n\nFinal Score: You collected ${collectedCount} out of ${totalTokensToSpawn} CHUD words!`);
    }
  </script>
</body>
</html>
